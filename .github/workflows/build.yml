name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation, examples and templates, and test all languages
        run: make check
      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            europecv.pdf
            examples/*.pdf
            templates/*.pdf
