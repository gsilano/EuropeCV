name: Check links

# Looks for dead links in the documentation once a month (the links to
# the Europass and Council of Europe websites tend to change).

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the links of the documentation
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'homepage\.com'
            --exclude 'youtube\.com/(AlanTouringChannel|Pythagoras)'
            --exclude 'acme\.com|uniny\.com|greatapple\.com'
            README.md CONTRIBUTING.md CHANGELOG.rst europecv.tex
          fail: true
