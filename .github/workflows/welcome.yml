name: Welcome

# Replaces the old Probot welcome apps (.github/config.yml): greets
# first-time contributors.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue here! Make sure that no other issues on the
            same topic have already been opened. If you are reporting a bug, please include
            a minimal example and the `.log` file.
          pr-message: >
            Thanks for opening this pull request! It will be checked as soon as possible.
            Please make sure that `CHANGELOG.rst` has been updated and that the automatic
            build passes.
